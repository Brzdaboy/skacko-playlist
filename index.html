<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SKáčko Playlist – SK Boršice</title>
<meta name="description" content="Gólová siréna a playlist pro SK Boršice" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#1a7a2d" />
<link rel="icon" href="icons/skb-logo-800x800x200-200x200.png" type="image/png" />

<!-- iOS home screen support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SKáčko" />
<link rel="apple-touch-icon" href="icons/skb-logo-800x800x200-200x200.png" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1>SKáčko Playlist</h1>
    <p class="subtitle">SK Boršice</p>
  </header>

  <main>
    <section class="goal-section" aria-label="Gólová siréna">
      <button id="goalBtn" class="goal-button" type="button" aria-pressed="false">
        <svg id="goalIconPlay" class="goal-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" fill="currentColor"/>
        </svg>
        <svg id="goalIconStop" class="goal-icon icon-hidden" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="1.5" fill="currentColor"/>
        </svg>
        <span class="goal-label" id="goalLabel">GÓL!</span>
      </button>
      <p class="goal-hint">Klikni při gólu</p>
    </section>

    <section class="playlist-section" aria-label="Playlist">
      <div class="playlist-header">
        <h2>Playlist</h2>
        <span id="offlineBadge" class="offline-badge" hidden>Offline</span>
      </div>
      <ul id="playlist" class="playlist"></ul>
    </section>
  </main>

  <footer class="app-footer">
    <p>Hraje i se zamčenou obrazovkou · Přidej si appku na plochu telefonu pro nejlepší zážitek</p>
  </footer>
</div>

<!-- Bottom player bar -->
<div id="playerBar" class="player-bar" hidden>
  <div class="player-seek">
    <span class="seek-time" id="timeCurrent">0:00</span>
    <div class="seek-track">
      <div class="seek-track-bg"></div>
      <div class="seek-fill" id="seekFill"></div>
      <input type="range" class="seek-input" id="seekInput" min="0" max="100" value="0" step="0.1" aria-label="Pozice v písni">
    </div>
    <span class="seek-time" id="timeDuration">0:00</span>
  </div>
  <div class="player-row">
    <div class="player-info">
      <img class="player-thumb" src="icons/skb-logo-800x800x200-200x200.png" alt="" aria-hidden="true">
      <span class="player-song-title" id="playerBarTitle"></span>
    </div>
    <div class="player-btns">
      <button id="barPrevBtn" class="bar-btn" type="button" aria-label="Předchozí píseň">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" fill="currentColor"/></svg>
      </button>
      <button id="barPlayBtn" class="bar-btn bar-play" type="button" aria-label="Přehrát">
        <svg viewBox="0 0 24 24" width="26" height="26"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
      </button>
      <button id="barNextBtn" class="bar-btn" type="button" aria-label="Další píseň">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 18l8.5-6L6 6v12zm10.5 0h-2V6h2z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</div>

<audio id="player" preload="none" playsinline></audio>

<script src="app.js"></script>
</body>
</html>
